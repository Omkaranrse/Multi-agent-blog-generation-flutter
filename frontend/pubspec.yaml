name: blog_multiagent_app
description: Flutter client for the multi-agent blog writer (web, iOS, Android).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  flutter_markdown: ^0.7.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  cloud_firestore: ^5.6.12
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
